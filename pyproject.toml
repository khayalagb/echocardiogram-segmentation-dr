[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-seg"
version = "0.1.0"
requires-python = ">=3.10"
description = "2D echocardiography segmentation on CAMUS with rigorous evaluation"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "segmentation-models-pytorch>=0.3",
    "albumentations>=1.3",
    "SimpleITK>=2.3",
    "nibabel>=5.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-image>=0.21",
    "matplotlib>=3.7",
    "plotly>=5.15",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "onnx>=1.14",
    "onnxruntime>=1.16",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"
